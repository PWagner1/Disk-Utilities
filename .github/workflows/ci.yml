name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Build solution (x64)
        # Serial project build avoids WinUI apps racing on shared bin\ *.xbf outputs
        run: dotnet build "Source/Disk Utilities.sln" -c ${{ matrix.configuration }} -p:Platform=x64 -m:1 --verbosity minimal

      - name: Test
        run: dotnet test "Source/DiskUtilities.Tests/DiskUtilities.Tests.csproj" -c ${{ matrix.configuration }} -p:Platform=x64 -m:1 --no-build --verbosity minimal
