version: 2
updates:
  - package-ecosystem: nuget
    directory: /Source
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      windows-app-sdk:
        patterns:
          - Microsoft.WindowsAppSDK*
          - Microsoft.Windows.SDK.BuildTools*
      testing:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk*
          - coverlet*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
